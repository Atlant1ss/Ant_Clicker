<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>Ant Clicker</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="../js/game_logic/main_loop.js" defer></script>
    </head>
    <body>
        <nav>
            <ul>
                <span id="username_display">Username: </span>
                <span id="ant_count">Ants: 0</span>
                <span>Rank: 0</span> <!--rank-->
            </ul>
        </nav>
        <section>
            <button id="comum_ant_button"><span class="emoji">🐜</span> hatch ant</button> 
            <p>hatch ant</p>
            <p id="comum_price"> 0 </p><!--switch to image -->
        </section>
        <h2>Special Ants</h2>
        <div class="special_ants">
            <section id="worker_ant">
                <button id="worker_ant_button" title="Generates 1 ant per second."><span class="emoji"></span> hatch Worker</button>
                <p> hatch Worker</p>
                <p id="worker_price"> 10$ | 0</p> <!--switch to image -->
            </section>
            <section id="queen_ant">
                <button id="queen_ant_button" title="Increases your click strength by 1.">hatch Queen</button>
                <p> hatch Queen</p>
                <p id="queen_price"> 50$ | 0</p> <!--switch to image -->
            </section>
            <section id="soldier_ant">
                <button id="soldier_ant_button" title="Increases your critical hit chance and critical damage multiplier.">hatch Soldier</button>
                <p> hatch Soldier</p>
                <p id="soldier_price"> 100$ | 0</p> <!--switch to image -->
            </section>
            <section id="explorer_ant">
                <button id="explorer_ant_button" title="Randomly spawns a sugar lump on the screen. Click it for a temporary buff.">hatch Explorer</button>
                <p> hatch Explorer </p>
                <p id="explorer_price"> 200$ | 0</p> <!--switch to image -->
            </section>
            <section id="witch_ant">
                <button id="witch_ant_button" title="Increases the efficiency of your other ants by a percentage.">hatch Witch</button>
                <p> hatch Witch</p>
                <p id="witch_price"> 500$ | 0</p> <!--switch to image -->
            </section>
            <section id="corporate_ant">
                <button id="corporate_ant_button" title="Earns interest based on the number of ants you currently have stored.">hatch Corporate</button>
                <p> hatch Corporate</p>
                <p id="corporate_price"> 1000$ | 0</p> <!--switch to image -->
            </section>
        </div> 

        <button type="button" style="position: fixed; right: 16px; bottom: 16px; width: 90px; height: 28px;" id="save_game_button">save game</button>

        <a href="../index.html">Back to Home</a>
    </body>
